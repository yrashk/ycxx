# The C++26 feature map's data (tools/feature-map/feature-map, #282). PRs change rows here and nothing else (#366).
#
# One [[feature]] per feature a user would name. Fields:
#   id        stable key (used in counts.tsv and probes.tsv)
#   name      what a user calls it
#   group     a [[group]] id
#   clauses   stable names in the pinned draft (tests/draft/PINS); a clause covers its subclauses
#   std       the standard it first appeared in (Annex C, the feature-test macro's first value,
#             cppreference's compiler-support tables); later extensions are their own rows
#   ftm       its feature-test macro, if any ([cpp.predefined], [version.syn])
#   detect    a Python regular expression counted over the corpus with comments and literals
#             blanked ('code'), or over code with literals kept when text = true
#   core      true: every program uses it; no detector, ranked as the most used
#   status    done | partial | missing, on main (judged from the probe, tests/own, the draft
#             examples, STATUS.md and the open issues)
#   issues    the issues that track what is missing or partial (required unless done)
#   note      what is missing, in a few words
#   probe     a whole program that returns 0 when the feature works; `feature-map probe`
#             builds and runs it with ycxx, and checks it with an oracle first

[[group]]
id = 'lex'
name = 'Lexical conventions and literals'

[[group]]
id = 'cpp'
name = 'Preprocessor'

[[group]]
id = 'basic'
name = 'Types, objects, storage and linkage'

[[group]]
id = 'expr'
name = 'Expressions'

[[group]]
id = 'lambda'
name = 'Lambdas'

[[group]]
id = 'stmt'
name = 'Statements'

[[group]]
id = 'dcl'
name = 'Declarations and initialization'

[[group]]
id = 'attr'
name = 'Attributes'

[[group]]
id = 'class'
name = 'Classes'

[[group]]
id = 'over'
name = 'Overloading'

[[group]]
id = 'temp'
name = 'Templates'

[[group]]
id = 'concepts'
name = 'Concepts'

[[group]]
id = 'except'
name = 'Exceptions'

[[group]]
id = 'coro'
name = 'Coroutines'

[[group]]
id = 'module'
name = 'Modules'

[[group]]
id = 'const'
name = 'Constant evaluation'

[[group]]
id = 'reflect'
name = 'Reflection and expansion statements'

[[group]]
id = 'contract'
name = 'Contracts'

[[group]]
id = 'lib'
name = 'Library support the compiler provides'

# --- Lexical conventions and literals ----------------------------------------------------------

[[feature]]
id = 'lex-core'
name = 'Tokens, identifiers, keywords, integer, character and string literals'
group = 'lex'
clauses = ['lex.separate', 'lex.phases', 'lex.char', 'lex.comment', 'lex.pptoken', 'lex.header', 'lex.ppnumber', 'lex.operators', 'lex.token', 'lex.name', 'lex.key', 'lex.literal*', 'lex.icon', 'lex.ccon', 'lex.string', 'lex.string.uneval', 'lex.bool']
std = 'C++98'
core = true
status = 'done'
probe = '''
int main() { const char* s = "a" "b"; char c = '\x41'; return (s[1] == 'b' && c == 'A' && 0x10 == 16 && 010 == 8 && true) ? 0 : 1; }
'''

[[feature]]
id = 'lex-digraph'
name = 'Alternative tokens (and, or, not, <% %>)'
group = 'lex'
clauses = ['lex.digraph']
std = 'C++98'
detect = '\b(?:and|or|not|bitand|bitor|xor|compl|and_eq|or_eq|xor_eq|not_eq)\b'
status = 'done'
probe = '''
int main() <% bool a = true, b = false; return (a and not b) ? 0 : 1; %>
'''

[[feature]]
id = 'lex-long-long'
name = '`long long`'
group = 'lex'
clauses = ['basic.fundamental', 'lex.icon']
std = 'C++11'
detect = '\blong\s+long\b|\b\d+[uU]?(?:ll|LL)\b'
status = 'done'
probe = '''
int main() { long long x = 1LL << 40; unsigned long long y = 2ull; return (x > 0 && y == 2) ? 0 : 1; }
'''

[[feature]]
id = 'lex-nullptr'
name = '`nullptr` and `std::nullptr_t`'
group = 'lex'
clauses = ['lex.nullptr', 'basic.fundamental', 'conv.ptr']
std = 'C++11'
detect = '\bnullptr(?:_t)?\b'
status = 'partial'
issues = [199]
note = '`std::nullptr_t` conversions and casts'
probe = '''
int main() { int* p = nullptr; decltype(nullptr) n = nullptr; return (p == nullptr && !n) ? 0 : 1; }
'''

[[feature]]
id = 'lex-raw-string'
name = 'Raw string literals'
group = 'lex'
clauses = ['lex.string']
std = 'C++11'
ftm = '__cpp_raw_strings'
detect = '\b(?:u8|u|U|L)?R""'
status = 'done'
probe = '''
int main() { const char* s = R"x(a\b)x"; return (s[1] == '\\' && s[3] == 0) ? 0 : 1; }
'''

[[feature]]
id = 'lex-unicode-literals'
name = 'Unicode literals (`u8`, `u`, `U`) and `char16_t`, `char32_t`'
group = 'lex'
clauses = ['lex.string', 'lex.ccon', 'basic.fundamental']
std = 'C++11'
ftm = '__cpp_unicode_literals'
detect = '''\b(?:u8|u|U)R?(?:""|'{2})|\bchar(?:16|32)_t\b'''
probe = '''
int main() { const char16_t* s = u"ab"; char32_t c = U'x'; return (s[1] == u'b' && c == 120) ? 0 : 1; }
'''
status = 'done'
issues = [288]

[[feature]]
id = 'lex-char8'
name = '`char8_t`'
group = 'lex'
clauses = ['basic.fundamental', 'lex.ccon', 'lex.string']
std = 'C++20'
ftm = '__cpp_char8_t'
detect = '\bchar8_t\b'
status = 'done'
probe = '''
int main() { const char8_t* s = u8"a"; char8_t c = u8'b'; return (s[0] == 97 && c == 98) ? 0 : 1; }
'''

[[feature]]
id = 'lex-binary'
name = 'Binary literals'
group = 'lex'
clauses = ['lex.icon']
std = 'C++14'
ftm = '__cpp_binary_literals'
detect = '\b0[bB][01]'
status = 'done'
probe = '''
int main() { return 0b101 == 5 ? 0 : 1; }
'''

[[feature]]
id = 'lex-digit-sep'
name = 'Digit separators'
group = 'lex'
clauses = ['lex.icon', 'lex.fcon']
std = 'C++14'
detect = '''\b\d[\dA-Fa-fxXbB]*'[\dA-Fa-f]'''
status = 'done'
probe = '''
int main() { return 1'000'000 == 1000000 ? 0 : 1; }
'''

[[feature]]
id = 'lex-hex-float'
name = 'Hexadecimal floating literals'
group = 'lex'
clauses = ['lex.fcon']
std = 'C++17'
ftm = '__cpp_hex_float'
detect = '''\b0[xX][\dA-Fa-f']*\.?[\dA-Fa-f']*[pP][+-]?\d'''
status = 'done'
issues = [336]
probe = '''
int main() { double d = 0x1.8p1; return d == 3.0 ? 0 : 1; }
'''

[[feature]]
id = 'lex-udl'
name = 'User-defined literals'
group = 'lex'
clauses = ['lex.ext', 'over.literal']
std = 'C++11'
ftm = '__cpp_user_defined_literals'
detect = '''\boperator\s*""\s*\w+|""_\w+|\b\d[\w']*_\w+\b|\b\d+(?:ms|us|ns|min|h|s|sv)\b|""(?:s|sv)\b'''
status = 'partial'
probe = '''
constexpr unsigned long long operator""_k(unsigned long long v) { return v * 1000; }
int main() { return 2_k == 2000 ? 0 : 1; }
'''
issues = [289]
note = 'Cooked integer calls through namespace literal operators. Raw, floating-point, character, string and template calls remain.'

[[feature]]
id = 'lex-size-t-suffix'
name = '`z` and `uz` literal suffixes'
group = 'lex'
clauses = ['lex.icon']
std = 'C++23'
ftm = '__cpp_size_t_suffix'
detect = '''\b\d[\d']*(?:[uU][zZ]|[zZ][uU]?)\b'''
status = 'done'
probe = '''
int main() { unsigned long n = 3uz; return n == 3 ? 0 : 1; }
'''

[[feature]]
id = 'lex-escapes'
name = 'Named (`\N{…}`) and delimited (`\x{…}`, `\o{…}`, `\u{…}`) escapes'
group = 'lex'
clauses = ['lex.charset', 'lex.universal.char', 'lex.ccon']
std = 'C++23'
ftm = '__cpp_named_character_escapes'
text = true
detect = '\\N\{|\\[xou]\{'
status = 'done'
probe = '''
int main() { char32_t c = U'\N{LATIN SMALL LETTER A}'; char d = '\x{42}'; return (c == 97 && d == 66) ? 0 : 1; }
'''

[[feature]]
id = 'lex-unicode-ident'
name = 'Unicode identifiers (UAX #31) and UTF-8 source'
group = 'lex'
clauses = ['lex.name', 'lex.phases']
std = 'C++23'
detect = '[^\x00-\x7f]'
status = 'done'
probe = '''
int main() { int café = 1; return café - 1; }
'''

# --- Preprocessor ---------------------------------------------------------------------------------

[[feature]]
id = 'cpp-include'
name = '`#include` and include paths'
group = 'cpp'
clauses = ['cpp.pre', 'cpp.include']
std = 'C++98'
detect = '(?m)^\s*#\s*include\b'
status = 'done'

[[feature]]
id = 'cpp-macros'
name = 'Object-like and function-like macros, `#` and `##`'
group = 'cpp'
clauses = ['cpp.replace', 'cpp.subst', 'cpp.stringize', 'cpp.concat', 'cpp.rescan', 'cpp.scope']
std = 'C++98'
detect = '(?m)^\s*#\s*define\b'
status = 'done'
probe = '''
#define CAT(a, b) a##b
#define STR(x) #x
int main() { int CAT(x, y) = 0; return STR(q)[0] == 'q' ? xy : 1; }
'''

[[feature]]
id = 'cpp-cond'
name = 'Conditional inclusion (`#if`, `#ifdef`, `defined`)'
group = 'cpp'
clauses = ['cpp.cond']
std = 'C++98'
detect = '(?m)^\s*#\s*(?:if|ifdef|ifndef|elif)\b'
status = 'done'

[[feature]]
id = 'cpp-misc'
name = '`#line`, `#error`, `#pragma`, the null directive'
group = 'cpp'
clauses = ['cpp.line', 'cpp.error', 'cpp.pragma', 'cpp.null']
std = 'C++98'
detect = '(?m)^\s*#\s*(?:line|error|pragma)\b'
status = 'done'
issues = [172]

[[feature]]
id = 'cpp-predefined'
name = 'Predefined macros (`__cplusplus`, `__FILE__`, `__LINE__`, …)'
group = 'cpp'
clauses = ['cpp.predefined']
std = 'C++98'
detect = '\b__(?:FILE|LINE|DATE|TIME)__\b|\b__cplusplus\b'
status = 'done'
probe = '''
int main() { return (__cplusplus >= 202400L && __LINE__ == 1) ? 0 : 1; }
'''

[[feature]]
id = 'cpp-variadic-macros'
name = 'Variadic macros (`__VA_ARGS__`)'
group = 'cpp'
clauses = ['cpp.replace.general']
std = 'C++11'
detect = '__VA_ARGS__'
status = 'done'
probe = '''
#define SUM(...) add(__VA_ARGS__)
int add(int a, int b) { return a + b; }
int main() { return SUM(1, -1); }
'''

[[feature]]
id = 'cpp-pragma-op'
name = '`_Pragma`'
group = 'cpp'
clauses = ['cpp.pragma.op']
std = 'C++11'
detect = '\b_Pragma\s*\('
status = 'done'

[[feature]]
id = 'cpp-has-include'
name = '`__has_include`'
group = 'cpp'
clauses = ['cpp.cond']
std = 'C++17'
detect = '\b__has_include\b'
status = 'done'

[[feature]]
id = 'cpp-va-opt'
name = '`__VA_OPT__`'
group = 'cpp'
clauses = ['cpp.subst']
std = 'C++20'
detect = '\b__VA_OPT__\b'
status = 'done'
probe = '''
#define F(a, ...) a __VA_OPT__(+ __VA_ARGS__)
int main() { return F(1, -1) + F(0); }
'''

[[feature]]
id = 'cpp-has-cpp-attribute'
name = '`__has_cpp_attribute` and the feature-test macros'
group = 'cpp'
clauses = ['cpp.cond', 'cpp.predefined']
std = 'C++20'
detect = '\b__has_cpp_attribute\b|\b__cpp_\w+'
status = 'done'

[[feature]]
id = 'cpp-elifdef'
name = '`#elifdef`, `#elifndef`'
group = 'cpp'
clauses = ['cpp.cond']
std = 'C++23'
detect = '(?m)^\s*#\s*elifn?def\b'
status = 'done'

[[feature]]
id = 'cpp-warning'
name = '`#warning`'
group = 'cpp'
clauses = ['cpp.error']
std = 'C++23'
detect = '(?m)^\s*#\s*warning\b'
status = 'done'
issues = [172]

[[feature]]
id = 'cpp-embed'
name = '`#embed` and `__has_embed`'
group = 'cpp'
clauses = ['cpp.embed*']
std = 'C++26'
ftm = '__cpp_pp_embed'
detect = '(?m)^\s*#\s*embed\b|\b__has_embed\b'
status = 'missing'
issues = [125]
probe = '''
int main() { const unsigned char d[] = {
#embed __FILE__ limit(3)
}; return sizeof d == 3 ? 0 : 1; }
'''

# --- Types, objects, storage and linkage ---------------------------------------------------------

[[feature]]
id = 'basic-integral'
name = 'Integer, character and `bool` types, conversions and promotions'
group = 'basic'
clauses = ['basic.types', 'basic.types.general', 'basic.fundamental', 'basic.compound', 'basic.type.qualifier', 'conv.rank', 'conv', 'conv.general', 'conv.lval', 'conv.array', 'conv.func', 'conv.rval', 'conv.qual', 'conv.prom', 'conv.integral', 'conv.bool', 'expr.arith.conv']
std = 'C++98'
core = true
status = 'done'
probe = '''
int main() { unsigned char c = 255; short s = c; long l = s + 1; bool b = l; return (l == 256 && b && -1 < 0u == false) ? 0 : 1; }
'''

[[feature]]
id = 'basic-float'
name = 'Floating-point types: values, literals, arithmetic, conversions'
group = 'basic'
clauses = ['basic.fundamental', 'lex.fcon', 'conv.fpprom', 'conv.double', 'conv.fpint']
std = 'C++98'
detect = '\b(?:float|double)\b'
status = 'done'
issues = [336]
probe = '''
int main() { double d = 1.5; float f = 2.0f; d = d * f + 0.5; return (int)d == 3 ? 0 : 1; }
'''

[[feature]]
id = 'basic-ext-fp'
name = 'Extended floating-point types (`std::float16_t`, `bfloat16_t`, `f16` suffixes)'
group = 'basic'
clauses = ['basic.extended.fp', 'lex.fcon', 'conv.rank']
std = 'C++23'
detect = '\b(?:std::)?b?float(?:16|32|64|128)_t\b|\b\d[\d.]*(?:f16|f32|f64|f128|bf16|F16|F32|F64|F128|BF16)\b'
status = 'missing'
issues = [351]
probe = '''
int main() { decltype(1.0f32) x = 1.5f32; return x > 1 ? 0 : 1; }
'''

[[feature]]
id = 'basic-ptr-arr-ref'
name = 'Pointers, arrays and lvalue references'
group = 'basic'
clauses = ['basic.compound', 'dcl.ptr', 'dcl.ref', 'dcl.array', 'conv.ptr', 'expr.sub']
std = 'C++98'
core = true
status = 'done'
probe = '''
int main() { int a[3] = {1, 2, 3}; int* p = a + 1; int& r = a[2]; r = *p; return a[2] == 2 ? 0 : 1; }
'''

[[feature]]
id = 'basic-fnptr'
name = 'Pointers to functions'
group = 'basic'
clauses = ['dcl.fct', 'conv.func', 'conv.fctptr', 'over.over']
std = 'C++98'
detect = '\(\s*\*\s*\w*\s*\)\s*\('
probe = '''
int twice(int x) { return 2 * x; }
int main() { int (*f)(int) = twice; return f(2) == 4 ? 0 : 1; }
'''
status = 'partial'
issues = [196, 219, 287, 407]
note = 'variadic indirect calls, noexcept conversions, C language linkage and external ELF addresses'

[[feature]]
id = 'basic-rvalue-ref'
name = 'Rvalue references and move semantics'
group = 'basic'
clauses = ['dcl.ref', 'dcl.init.ref', 'basic.lval', 'class.copy.ctor']
std = 'C++11'
ftm = '__cpp_rvalue_references'
detect = '\bstd::(?:move|forward)\b|\w&&(?=\s*[\w,)>.])'
status = 'partial'
issues = [199, 290]
note = 'reference downcasts and the `S b(S(1))` initializer ambiguity'
probe = '''
struct S { int v; S(int x) : v(x) {} S(S&& o) : v(o.v) { o.v = 0; } };
int main() { int&& r = 1; S a(1); S b(static_cast<S&&>(a)); return (r == 1 && b.v == 1 && a.v == 0) ? 0 : 1; }
'''

[[feature]]
id = 'basic-lookup'
name = 'Scopes and name lookup (unqualified, qualified, class members)'
group = 'basic'
clauses = ['basic.pre', 'basic.def', 'basic.scope*', 'basic.lookup*', 'class.member.lookup', 'basic.lookup.unqual', 'basic.lookup.qual', 'class.qual', 'namespace.qual', 'basic.lookup.elab', 'basic.lookup.udir']
std = 'C++98'
core = true
status = 'done'
issues = [216]

[[feature]]
id = 'basic-adl'
name = 'Argument-dependent lookup'
group = 'basic'
clauses = ['basic.lookup.argdep']
std = 'C++98'
core = true
status = 'partial'
issues = [165, 259]
note = 'ordinary namespace calls, inline namespaces and ordinary class bases work. Remaining cases include hidden friends, block function declarations, class template arguments, overload sets and template-ids'
probe = '''
namespace n { struct S {}; int f(S) { return 0; } }
int main() { n::S s; return f(s); }
'''

[[feature]]
id = 'basic-linkage'
name = 'Linkage, the one-definition rule, inline functions'
group = 'basic'
clauses = ['basic.link', 'basic.def.odr', 'dcl.inline']
std = 'C++98'
core = true
status = 'partial'
issues = [124, 193, 422]
note = 'x86-64 ELF weak definitions for ordinary external inline functions. ELF groups, Mach-O weak definitions and internal-linkage mangling remain'

[[feature]]
id = 'basic-inline-vars'
name = 'Inline variables'
group = 'basic'
clauses = ['dcl.inline']
std = 'C++17'
ftm = '__cpp_inline_variables'
detect = '\binline\s+(?:static\s+)?(?:const(?:expr)?\s+)?[\w:<>,]+\s+\w+\s*(?:=|\{|;)|\bstatic\s+(?:constexpr\s+)?inline\s+(?!\w+\s*\()'
status = 'partial'
issues = [124, 368, 422, 432]
note = 'x86-64 ELF shares constant-initialized external namespace variables with relocation-free initial values. Broader inline data and group selection remain'
probe = '''
inline int counter = 41;
struct S { static inline int n = 1; };
int main() { return counter + S::n == 42 ? 0 : 1; }
'''

[[feature]]
id = 'basic-object-lifetime'
name = 'Object lifetime, temporaries and lifetime extension'
group = 'basic'
clauses = ['basic.memobj', 'intro.memory', 'intro.object', 'basic.align', 'basic.life', 'basic.stc*', 'basic.stc.auto', 'basic.stc.static', 'class.temporary']
std = 'C++98'
core = true
status = 'partial'
issues = [157]
note = 'temporaries in some contexts'
probe = '''
int n = 0;
struct T { int v; T(int x) : v(x) {} ~T() { ++n; } };
int main() { { const T& r = T(3); if (n != 0 || r.v != 3) return 1; } return n == 1 ? 0 : 1; }
'''

[[feature]]
id = 'basic-elision'
name = 'Copy elision: guaranteed elision and implicit move'
group = 'basic'
clauses = ['class.copy.elision', 'dcl.init.general', 'stmt.return']
std = 'C++17'
ftm = '__cpp_guaranteed_copy_elision'
status = 'done'
probe = '''
struct N { int v; N(int x) : v(x) {} N(const N&) = delete; N(N&&) = delete; };
N make() { return N(7); }
int main() { N n = make(); return n.v == 7 ? 0 : 1; }
'''

[[feature]]
id = 'basic-static-local'
name = 'Block-scope static variables (thread-safe initialization)'
group = 'basic'
clauses = ['stmt.dcl', 'basic.stc.static']
std = 'C++98'
ftm = '__cpp_threadsafe_static_init'
detect = '''(?m)^[ \t]{4,}static\s+(?!_assert|assert|inline\b|void\b|constexpr\b|const\b)[\w:<>]+[\s*&]+\w+\s*(?:=|\{|;)'''
status = 'partial'
probe = '''
int calls = 0;
int init() { return ++calls; }
int get() { static int v = init(); return v; }
int main() { get(); return (get() == 1 && calls == 1) ? 0 : 1; }
'''
issues = [124, 372]
note = "inline functions' statics are per unit; the guard is always called"

[[feature]]
id = 'basic-dynamic-init'
name = 'Dynamic initialization and destruction of namespace-scope variables'
group = 'basic'
clauses = ['basic.start', 'basic.start.main', 'basic.start.static', 'basic.start.dynamic', 'basic.start.term']
std = 'C++98'
core = true
status = 'partial'
issues = [367, 368]
note = 'function references and reference lifetime extension; inline and templated dynamic initialization'
probe = '''
int f() { return 42; }
int g = f();
int main() { return g == 42 ? 0 : 1; }
'''

[[feature]]
id = 'basic-thread-local'
name = '`thread_local` variables'
group = 'basic'
clauses = ['basic.stc.thread', 'dcl.stc']
std = 'C++11'
detect = '\bthread_local\b'
status = 'missing'
probe = '''
thread_local int t = 3;
int main() { return t == 3 ? 0 : 1; }
'''
issues = [292, 73]

[[feature]]
id = 'basic-new-delete'
name = '`new` and `delete` expressions, placement new, replaceable allocation functions'
group = 'basic'
clauses = ['expr.new', 'expr.delete', 'basic.stc.dynamic*', 'dcl.fct.def.replace']
std = 'C++98'
detect = '\bnew\s+[\w:(]|\bdelete\s*(?:\[\s*\])?\s*[\w(*]'
status = 'partial'
note = 'ordinary global scalar new and single-object delete for integral and pointer objects; class and array allocation, placement, and exception cleanup remain'
probe = '''
struct S { int v; S(int x) : v(x) {} };
int main() { S* p = new S(5); int r = p->v; delete p; int* a = new int[3]; delete[] a; return r == 5 ? 0 : 1; }
'''
issues = [293]

[[feature]]
id = 'basic-aligned-new'
name = 'Allocation of over-aligned types'
group = 'basic'
clauses = ['basic.stc.dynamic.allocation', 'expr.new']
std = 'C++17'
ftm = '__cpp_aligned_new'
detect = '\balign_val_t\b'
status = 'missing'
probe = '''
struct alignas(64) A { char c; };
int main() { A* a = new A; bool ok = (reinterpret_cast<unsigned long>(a) % 64) == 0; delete a; return ok ? 0 : 1; }
'''
issues = [293, 303]

[[feature]]
id = 'basic-sized-delete'
name = 'Sized deallocation'
group = 'basic'
clauses = ['basic.stc.dynamic.deallocation']
std = 'C++14'
ftm = '__cpp_sized_deallocation'
detect = '\boperator\s+delete\s*(?:\[\s*\])?\s*\([^)]*,\s*(?:std::)?size_t'
status = 'partial'
note = 'ordinary global sized delete for complete integral and pointer objects'
issues = [293]

[[feature]]
id = 'basic-destroying-delete'
name = 'Destroying `operator delete`'
group = 'basic'
clauses = ['expr.delete', 'basic.stc.dynamic.deallocation']
std = 'C++20'
ftm = '__cpp_impl_destroying_delete'
detect = '\bdestroying_delete\b'
status = 'missing'
issues = [293]

# --- Expressions -----------------------------------------------------------------------------------

[[feature]]
id = 'expr-core'
name = 'Operators, calls, member access, `sizeof`, the conditional and comma operators'
group = 'expr'
