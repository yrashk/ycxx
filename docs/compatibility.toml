# Entries record ycxx behavior selected by -fcompat and deliberate shared policies for known
# divergences. The generated draft-example verdicts in tests/draft/DISAGREEMENTS.md cover the
# broader set of oracle disagreements, including implementation gaps and diagnostic locations.
schema = 1
default = "spec"
draft_disagreements = "tests/draft/DISAGREEMENTS.md"
draft_pins = "tests/draft/PINS"
oracle_versions = "tests/draft/oracle-versions.txt"
extensions = "docs/EXTENSIONS.md"
observed_gcc = "GCC 16.2.0"
observed_clang = "Clang 23.1.6 (5b10d2d74929)"

[audit]
base_commit = "53994e49"
sources = ["DECISIONS.md", "STATUS.md", "docs/LESSONS.md", "docs/design", "tests/own", "tests/draft/DISAGREEMENTS.md", "git log --all"]

# Entry status is selectable for implemented mode differences, partial for implemented slices,
# recorded for differences without a mode rule, and shared for a deliberate common policy.
# The spec/gcc/clang fields describe current ycxx behavior. The *_observed fields record
# additional oracle observations. Mode status applies to the case described by the entry.
[mode_status_values]
supported = "ycxx follows the mode's oracle or a documented shared policy for this case."
partial = "ycxx follows the mode's oracle for part of this case. See limits."
pending = "A known oracle difference still needs a mode-specific implementation."
unverified = "The available evidence does not establish whether ycxx matches this oracle."

[modes]
spec = "Pinned C++26 draft, applicable defect resolutions, and published target ABI."
gcc = "GCC 16.2 for the behavior recorded here."
clang = "Upstream Clang 23.1 for the behavior recorded here."

