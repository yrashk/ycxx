name: Arm64 rule compiler hashing baseline

on:
  push:
    branches: [codex/ycxx-watch-hash-baseline-1671]

permissions:
  contents: read

concurrency:
  group: watch-hash-baseline-1671
  cancel-in-progress: true

jobs:
  measure:
    if: github.repository == 'yrashk/ycxx'
    runs-on: macos-15
    timeout-minutes: 40
    env:
      BASELINE: c83a20a9609afff3bc258793482b929e73345971
      BASELINE_TREE: 34b596393c7d392e9df6005aa8d2a1b7172b517d
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          submodules: true
          persist-credentials: false
      - name: Verify the exact current-main baseline and capture instrumentation diff
        shell: bash
        run: |
          output="$RUNNER_TEMP/ycxx-hash-baseline-1671"
          mkdir -p "$output/watch"
          test "$(uname -m)" = arm64
          test "$(git merge-base HEAD "$BASELINE")" = "$BASELINE"
          test "$(git rev-parse "$BASELINE^{tree}")" = "$BASELINE_TREE"
          test "$(git -C deps/libycxx rev-parse HEAD)" = "$(git rev-parse "$BASELINE:deps/libycxx")"
          test "$(git diff --name-only "$BASELINE" -- src)" = src/project_build/plan.cppm
          git diff --exit-code "$BASELINE" -- tests/daemon
          grep -F 'deadline = time.monotonic() + 25' tests/daemon/project_build_watch.py
          git diff "$BASELINE" -- src/project_build/plan.cppm | tee "$output/instrumentation.diff"
          {
            git rev-parse HEAD "$BASELINE" 'HEAD^{tree}' "$BASELINE^{tree}"
            git -C deps/libycxx rev-parse HEAD
            printf 'image %s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            sw_vers
            uname -a
            sysctl hw.ncpu hw.memsize
            uptime
            shasum -a 256 tests/daemon/project_build_watch.py
          } | tee "$output/provenance.txt"
      - uses: ./.github/actions/setup
        with:
          oracle: 'true'
      - name: Build the instrumented Debug binary
        shell: bash
        run: |
          output="$RUNNER_TEMP/ycxx-hash-baseline-1671"
          export YCXX_CI_CMAKE_BIN="$(dirname "$(command -v cmake)")"
          source deps/libycxx/tools/toolchain/activate.sh
          unset YCXX_ROOT
          test "$(cmake --version | head -n 1)" = 'cmake version 4.4.5'
          {
            "$YCXX_GXX" --version
            "$YCXX_CLANGXX" --version
            xcodebuild -version
            xcrun --show-sdk-path
            xcrun --show-sdk-version
            cmake --version
            python3 --version
          } | tee -a "$output/provenance.txt"
          tools/build -j 3 --no-smoke 2>&1 | tee "$output/build.log"
          shasum -a 256 build/bin/ycxx | tee -a "$output/provenance.txt"
      - name: Measure the original 25-second staged-witness deadline
        shell: bash
        run: |
          export YCXX_CI_CMAKE_BIN="$(dirname "$(command -v cmake)")"
          source deps/libycxx/tools/toolchain/activate.sh
          unset YCXX_ROOT
          test "$(ctest --version | head -n 1)" = 'ctest version 4.4.5'
          output="$RUNNER_TEMP/ycxx-hash-baseline-1671"
          harness="$GITHUB_WORKSPACE/.github/evidence/watch-hash-baseline-1671"
          test "$(command -v clang++)" = "$YCXX_CLANGXX"
          export PYTHONPATH="$harness"
          export YCXX_WATCH_EVIDENCE="$output/watch"
          export YCXX_COMPILER_HASH_EVIDENCE="$output/compiler-hash.tsv"
          printf 'PATH=%s\nSDKROOT=%s\n' "$PATH" "$SDKROOT" >> "$output/provenance.txt"
          uptime | tee -a "$output/provenance.txt"
          set +e
          ctest --test-dir build --output-on-failure -j 1 -R '^daemon\.project_staged_witness$' 2>&1 | tee "$output/ctest.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" | tee "$output/ctest-exit.txt"
          unset YCXX_WATCH_EVIDENCE
          if test -d build/Testing; then cp -R build/Testing "$output/Testing"; fi
          python3 -B - <<'PY' | tee "$output/candidate-files.json"
          from hashlib import file_digest
          from pathlib import Path
          from shutil import which
          import json
          records = []
          for name in ('c++', 'clang++', 'g++'):
              spelling = which(name)
              if spelling is None:
                  continue
              path = Path(spelling).resolve()
              with path.open('rb') as binary:
                  records.append(dict(name=name, spelling=spelling, resolved=str(path),
                                      bytes=path.stat().st_size, sha256=file_digest(binary, 'sha256').hexdigest()))
          print(json.dumps(records, indent=2))
          PY
          python3 -B "$harness/report.py" "$output" | tee "$output/measurements.log"
      - name: Upload exact diff, watch traces and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ycxx-1671-arm64-hash-baseline
          path: ${{ runner.temp }}/ycxx-hash-baseline-1671/
          if-no-files-found: error
          retention-days: 14
