name: ci

# The pull-request and main tiers (DECISIONS §9). Both hosts, stages in fail-fast order: policy,
# build with the bootstrap smoke test, then the test driver's tier. A newer push to the same
# branch or PR cancels the older run, and documentation-only changes run nothing. The last job
# records the run's wall time.

on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  test:
    name: linux-x86_64
    runs-on: ubuntu-24.04
    container: 'gcc:16'
    timeout-minutes: 30
    env:
      TIER: ${{ github.event_name == 'pull_request' && 'pr' || 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          # The affected stage needs the first parent of the PR merge commit.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

      - name: Trust the checkout in the Linux container
        # actions/checkout sets safe.directory in its temporary HOME only.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/deps/libycxx"

      - name: Toolchain (GCC 16 and Clang 23 oracle)
        uses: ./.github/actions/setup
        with:
          oracle: 'true'

      - name: Test driver self-test
        if: env.TIER == 'main'
        run: python3 -m unittest -q tests.driver.selftest

      - name: Policy (tools/check-policy)
        run: tools/check-policy

      - name: Build and CTest suites (tools/build --all-tests)
        run: tools/build --all-tests -j 4

      - name: Standalone YCXX Bench install and external consumer
        run: tools/ci/bench-package 4

      # The driver's fail-fast state (DECISIONS §9.6), keyed as tools/test (#5) expects.
      - name: Restore test state
        uses: actions/cache/restore@v4
        with:
          path: build/test-state
          key: test-state-${{ github.head_ref || github.ref_name }}-linux-x86_64-${{ github.run_id }}
          restore-keys: |
            test-state-${{ github.head_ref || github.ref_name }}-linux-x86_64-
            test-state-main-linux-x86_64-

      - name: Tests (tools/test, ${{ env.TIER }} tier)
        run: |
          if [ "$TIER" = pr ]; then
            # tools/build --all-tests above already ran the bootstrap, unit and daemon CTests.
            base=$(git rev-parse --verify HEAD^1)
            tools/test -x policy failed affected core --base "$base" -j 4
          else
            tools/test -x failed affected core wider rest -j 4
          fi

      - name: Save test state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: build/test-state
          key: test-state-${{ github.head_ref || github.ref_name }}-linux-x86_64-${{ github.run_id }}

      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-linux-x86_64
          path: build/test-logs/
          if-no-files-found: ignore

  macos-arm64:
    name: macos-arm64 (build & ctest)
    runs-on: macos-15
    # issues: the feature map's tracking issue (#282) is rewritten on main (DECISIONS §6.9).
    permissions:
      contents: read
      actions: read
      issues: write
    timeout-minutes: 45
    env:
      TIER: ${{ github.event_name == 'pull_request' && 'pr' || 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

      - name: Toolchain (GCC 16 and Clang 23 oracle)
        uses: ./.github/actions/setup
        with:
          oracle: 'true'

      - name: Test driver self-test
        if: env.TIER == 'main'
        run: python3 -m unittest -q tests.driver.selftest

      - name: Policy (tools/check-policy)
        run: tools/check-policy

      - name: Build and CTest suites (tools/build --all-tests)
        run: tools/build --all-tests -j 3

      - name: Standalone YCXX Bench install and external consumer
        run: tools/ci/bench-package 3

      # The α slice end to end (#39, #43): ycxx compiles, links and runs these programs. It runs
      # before the sharded tier, so a broken pipeline is the first failure reported (DECISIONS §9.2).
      - name: α slice (tools/test --cxx ycxx --no-unsupported core own/slice)
        run: tools/test --cxx ycxx --no-unsupported core own/slice -j 3

      # The feature map (DECISIONS §6.9, #366): every feature's probe built and run by ycxx, then
      # a status its probe contradicts fails the run.
      - name: Feature map (tools/feature-map/feature-map probe, check --probes)
        run: |
          tools/feature-map/feature-map probe -j 3
          tools/feature-map/feature-map render
          tools/feature-map/feature-map check --probes

      - name: Feature map tracking issue (#282, main only)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/feature-map/feature-map issue > build/feature-map/issue.md
          gh issue edit 282 -R "$GITHUB_REPOSITORY" --body-file build/feature-map/issue.md

      - name: Upload built ycxx binary and runtime for test shards
        uses: actions/upload-artifact@v4
        with:
          name: ycxx-macos-arm64
          path: |
            build/bin/ycxx
            build/deps/libycxx/libycxx.a
            build/deps/libycxx/libycxx-abi.a
            build/deps/libycxx/generated/include
            build/src/pipeline/libemutls_w.a
            build/src/pipeline/libgcc-int128.a
          retention-days: 1

      - name: Feature map files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-map
          path: build/feature-map/
          if-no-files-found: ignore

  # Duration-balanced sharding for macos-arm64 language tests (DECISIONS §9.4).
  macos-arm64-tests:
    name: macos-arm64 (shard ${{ matrix.shard }}/2)
    needs: [macos-arm64]
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix:
        shard: [1, 2]
    runs-on: macos-15
    timeout-minutes: 25
    env:
      TIER: ${{ github.event_name == 'pull_request' && 'pr' || 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

      - name: Toolchain (GCC 16 and Clang 23 oracle)
        uses: ./.github/actions/setup
        with:
          oracle: 'true'

      - name: Download built ycxx binary and runtime
        uses: actions/download-artifact@v4
        with:
          name: ycxx-macos-arm64
          path: build

      - name: Restore test state
        uses: actions/cache/restore@v4
        with:
          path: build/test-state
          key: test-state-${{ github.head_ref || github.ref_name }}-macos-arm64-${{ github.run_id }}
          restore-keys: |
            test-state-${{ github.head_ref || github.ref_name }}-macos-arm64-
            test-state-main-macos-arm64-

      - name: Tests (tools/test, ${{ env.TIER }} tier, shard ${{ matrix.shard }}/2)
        run: |
          chmod +x build/bin/ycxx
          if [ "$TIER" = pr ]; then
            base=$(git rev-parse --verify HEAD^1)
            tools/test -x failed affected core --base "$base" --shard ${{ matrix.shard }}/2 -j 3
          else
            tools/test -x failed affected core wider rest --shard ${{ matrix.shard }}/2 -j 3
          fi

      - name: Upload shard test state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-state-macos-arm64-${{ matrix.shard }}
          path: build/test-state/last-run.json
          retention-days: 1
          if-no-files-found: ignore

      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-macos-arm64-shard-${{ matrix.shard }}
          path: build/test-logs/
          if-no-files-found: ignore

  macos-arm64-merge-state:
    name: macos-arm64 (merge test state)
    needs: [macos-arm64-tests]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/test
            tests/driver
            tests/daemon/runtime_dir.py

      - name: Restore base test state
        uses: actions/cache/restore@v4
        with:
          path: build/test-state
          key: test-state-${{ github.head_ref || github.ref_name }}-macos-arm64-${{ github.run_id }}
          restore-keys: |
            test-state-${{ github.head_ref || github.ref_name }}-macos-arm64-
            test-state-main-macos-arm64-

      - name: Download shard states
        uses: actions/download-artifact@v4
        with:
          pattern: test-state-macos-arm64-*
          path: build/shard-states

      - name: Merge shard states
        run: |
          dirs=$(find build/shard-states -mindepth 1 -maxdepth 1 -type d)
          if [ -n "$dirs" ]; then
            tools/test --state build/test-state --merge-state $dirs
          fi

      - name: Save merged test state
        uses: actions/cache/save@v4
        with:
          path: build/test-state
          key: test-state-${{ github.head_ref || github.ref_name }}-macos-arm64-${{ github.run_id }}

  # Release (-O3 -DNDEBUG) compile-only, Linux only: GCC's warnings under -Werror and its crashes
  # differ by optimization level, and the test job builds Dev (#726). macOS runners are shared
  # across repositories (LESSONS), so macOS builds Release only in the nightly tier.
  release-build:
    name: linux-x86_64-release-build
    runs-on: ubuntu-24.04
    container: 'gcc:16'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Trust the checkout in the Linux container
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/deps/libycxx"

      - name: Toolchain (GCC 16)
        uses: ./.github/actions/setup

      - name: Release build (tools/build --no-smoke)
        env:
          YCXX_BUILD_TYPE: Release
        run: tools/build -j 4 --no-smoke

  policies-package:
    name: policies-package (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4

      - name: Standalone C++20 package conformance
        env:
          CXX: ${{ matrix.compiler }}
        run: python3 tests/unit/pipeline/policies_package.py cmake "$CXX" packages/ycxx-policies

  wall-time:
    needs: [test, macos-arm64, macos-arm64-tests, release-build, policies-package]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/ci
      - name: Record wall time (DECISIONS §9.8)
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/wall-time ${{ github.event_name == 'pull_request' && 'pr 15' || 'main 60' }}
      - uses: actions/upload-artifact@v4
        with:
          name: wall-time
          path: wall-time.json
