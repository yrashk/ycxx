name: CTest scheduling experiment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ctest-scheduling-1230-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    if: github.ref == 'refs/heads/codex/early-daemon-compare-ctest-experiment'
    runs-on: macos-15
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 2
          persist-credentials: false

      - name: Toolchain (GCC 16)
        uses: ./.github/actions/setup

      - name: Build one Debug product
        env:
          YCXX_BUILD_DIR: build
          YCXX_BUILD_TYPE: Debug
        run: |
          test "$(uname -m)" = arm64
          tools/build --no-smoke -j 3

      - name: Cold CTest A/B and B/A
        run: python3 -I .github/scripts/ctest-scheduling-1230.py "$RUNNER_TEMP/ctest-scheduling-1230"

      - name: Timing and pass records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-scheduling-1230
          path: ${{ runner.temp }}/ctest-scheduling-1230/
          if-no-files-found: ignore
          retention-days: 7
