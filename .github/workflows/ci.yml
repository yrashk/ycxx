name: GNU property archive probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  property-note:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile the foreign Make fixture with the runner system tools
        env:
          LC_ALL: C
        run: |
          set -euo pipefail
          proof=$RUNNER_TEMP/ycxx-property-proof
          mkdir -p "$proof/inputs/vendor" "$proof/outputs"
          cp -R examples/project-build/foreign-make/vendor/. "$proof/inputs/vendor/"
          cd "$proof"
          python3 - <<'PY'
          from pathlib import Path
          config = Path("inputs/vendor/include/score_config.h")
          contents = config.read_text(encoding="utf-8")
          anchor = "#define SCORE_BONUS 7"
          assert contents.count(anchor) == 1
          config.write_text(contents.replace(anchor, f"#ifndef SCORE_BONUS\n{anchor}\n#endif"), encoding="utf-8")
          PY
          printf '%s\n' "Image $ImageOS $ImageVersion"
          readlink -f /usr/bin/cc
          /usr/bin/cc --version
          /usr/bin/cc -dumpmachine
          /usr/bin/ar --version
          /usr/bin/env -i CC=/usr/bin/cc AR=/usr/bin/ar SOURCE_DIR=inputs/vendor \
            ARCHIVE=outputs/libforeign.a PATH=/usr/bin:/bin LC_ALL=C ZERO_AR_DATE=1 \
            /usr/bin/make -f inputs/vendor/Makefile archive
          /usr/bin/ar t outputs/libforeign.a
          /usr/bin/ar p outputs/libforeign.a score.o > archive-score.o
          cmp score.o archive-score.o
          sha256sum archive-score.o
          readelf -h -SW -n -rW archive-score.o | tee readelf.txt
          if readelf -SW archive-score.o | grep -F '.note.gnu.property'; then
            readelf -x .note.gnu.property archive-score.o | tee note.hex.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: foreign-archive-property-metadata
          path: |
            ${{ runner.temp }}/ycxx-property-proof/archive-score.o
            ${{ runner.temp }}/ycxx-property-proof/readelf.txt
            ${{ runner.temp }}/ycxx-property-proof/note.hex.txt
