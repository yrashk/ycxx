name: setup
description: >
  The bootstrap toolchain, as libycxx's CI provides it (deps/libycxx/.github/actions): on Linux,
  inside the gcc:16 container, GCC 16 from the image plus ninja, cmake and python3 from apt; on
  macOS, Homebrew's GCC 16, ninja and cmake. With oracle 'true', also Clang 23, the black-box
  oracle (DECISIONS §2.3), which never builds ycxx: apt.llvm.org on Linux, and on macOS the LLVM
  release provisioned by deps/libycxx/tools/toolchain/provision and cached.
inputs:
  oracle:
    description: also provision Clang 23 (the oracle)
    default: 'false'
runs:
  using: composite
  steps:
    - if: runner.os == 'Linux'
      shell: bash
      run: |
        apt-get update -qq
        apt-get install -y -qq ninja-build cmake python3 git >/dev/null
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - if: runner.os == 'Linux' && inputs.oracle == 'true'
      shell: bash
      run: |
        apt-get install -y -qq wget gnupg lsb-release >/dev/null
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key > /etc/apt/trusted.gpg.d/apt.llvm.org.asc
        echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-23 main" > /etc/apt/sources.list.d/llvm.list
        apt-get update -qq
        apt-get install -y -qq clang-23 lld-23 >/dev/null
    - if: runner.os == 'macOS'
      shell: bash
      run: brew install gcc ninja cmake
    - if: runner.os == 'macOS' && inputs.oracle == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.local/share/ycxx/toolchains
        key: ycxx-toolchains-${{ runner.os }}-${{ runner.arch }}-llvm-23.1.5
    - if: inputs.oracle == 'true'
      shell: bash
      run: deps/libycxx/tools/toolchain/provision --clang-only
    - shell: bash
      run: |
        g++-16 --version 2>/dev/null | head -1 || g++ --version | head -1
        cmake --version | head -1
        python3 --version
