name: setup-linux-tsan
description: >
  The toolchain for a ThreadSanitizer build of ycxx (#105), as libycxx's own action of the same
  name (deps/libycxx/.github/actions/setup-linux-tsan). The bare Linux runner lets the job lower
  vm.mmap_rnd_bits to 28 for ThreadSanitizer's shadow memory layout. The job uses GCC 16.2 with
  its sanitizer runtimes, built by libycxx's provision --with-sanitizers (about 17 minutes) and cached.
  Clang 23 is a peer for the native ABI tests.
runs:
  using: composite
  steps:
    - name: Report host glibc
      id: glibc
      shell: bash
      run: |
        glibc=$(getconf GNU_LIBC_VERSION)
        echo "$glibc"
        echo "version=${glibc#glibc }" >> "$GITHUB_OUTPUT"
    # ThreadSanitizer maps its shadow memory at fixed addresses, which the 32 bits of mmap
    # randomization of the runners' kernels can collide with ("FATAL: ThreadSanitizer: unexpected
    # memory mapping").
    - shell: bash
      run: |
        bits=$(sudo sysctl -n vm.mmap_rnd_bits)
        echo "vm.mmap_rnd_bits=$bits"
        if [ "$bits" -gt 28 ]; then sudo sysctl -w vm.mmap_rnd_bits=28; fi
    - shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq ninja-build python3 git xz-utils curl >/dev/null
    - name: Install CMake 4.4.5
      shell: bash
      run: |
        # CMake 4.5 scans the toolchain's std module with libycxx's -nostdinc++
        # (#381, yrashk/libycxx#29).
        cmake_dir=$(mktemp -d "$RUNNER_TEMP/ycxx-cmake.XXXXXX")
        cmake_archive=cmake-4.4.5-linux-x86_64
        curl -fsSL --retry 3 -o "$cmake_dir/$cmake_archive.tar.gz" \
          "https://github.com/Kitware/CMake/releases/download/v4.4.5/$cmake_archive.tar.gz"
        printf '%s  %s\n' ed85135c5a5135b45e50423cb406dea04ca3338da0b8ef3c9ede963559680be0 \
          "$cmake_dir/$cmake_archive.tar.gz" | sha256sum -c -
        tar -xzf "$cmake_dir/$cmake_archive.tar.gz" -C "$cmake_dir"
        echo "$cmake_dir/$cmake_archive/bin" >> "$GITHUB_PATH"
    - name: Report CMake
      shell: bash
      run: |
        command -v cmake
        cmake --version
    - uses: ./.github/actions/setup-linux-oracle
    - id: gcc-cache
      uses: actions/cache/restore@v4
      with:
        path: ~/.local/share/ycxx/toolchains/gcc-16.2.0
        key: ycxx-gcc-16.2.0-sanitizers-${{ runner.os }}-${{ runner.arch }}-glibc-${{ steps.glibc.outputs.version }}-${{ hashFiles('deps/libycxx/tools/toolchain/provision') }}
    - shell: bash
      run: |
        deps/libycxx/tools/toolchain/provision --with-sanitizers --jobs 4
        # The Linux ABI tests select the configured peer compilers by these paths.
        toolchains=${YCXX_TOOLCHAINS:-${XDG_DATA_HOME:-$HOME/.local/share}/ycxx/toolchains}
        grep -E '^YCXX_(GXX|CLANGXX)=' "$toolchains/toolchains.env" >> "$GITHUB_ENV"
    - if: steps.gcc-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/.local/share/ycxx/toolchains/gcc-16.2.0
        key: ${{ steps.gcc-cache.outputs.cache-primary-key }}
